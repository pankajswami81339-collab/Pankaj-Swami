<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="scaleCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="zenEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="64" height="64" rx="16" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" fill="none" />

  <!-- Geometric Monogram (Interlocking A-Z Scale & Zen) -->
  <!-- Ascending Scale Beam (A Apex) -->
  <path d="M16 45L28 15H36L24 45H16Z" fill="url(#scaleCyan)" />
  
  <!-- Zen Equilibrium Wing (Z Top Beam) -->
  <path d="M26 15H47V21H32L26 15Z" fill="url(#zenEmerald)" />

  <!-- Zen Return Wing (Z Bottom Foundation) -->
  <path d="M17 39H38V45H17V39Z" fill="url(#zenEmerald)" />

  <!-- Harmonic Intersecting Traverse -->
  <path d="M43 21L27 41H35L47 25V21H43Z" fill="url(#beamGrad)" filter="url(#glow)" />

  <!-- AI Automation Core Pulse (Center Synapse) -->
  <circle cx="32" cy="30" r="3" fill="#ffffff" />
  <circle cx="32" cy="30" r="5" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" fill="none" opacity="0.9" />
</svg>
